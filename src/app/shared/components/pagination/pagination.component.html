<div class="join flex justify-center items-center mt-4 mb-10">
  @for (page of getPages(); track page) {
  <button
    class="join-item btn"
    [routerLink]="[]"
    [queryParams]="{ page }"
    [class.btn-primary]="page === this.activePage()"
    (click)="this.activePage.set(page)"
  >
    {{ page }}
  </button>

  } @empty {
  <p>No hay Paginas</p>
  }
</div>
