<h1 class="text-3xl font-bold font-montserrat mt-2">
  Todos los productos de
  <span class="text-primary">{{ this.gender() | i18nSelect : genderMap }}</span>
</h1>
<h2 class="text-xl mb-7">Al mejor precio</h2>

<div
  class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 mt-2 gap-2"
>
  @for (product of this.productsGenderResource.value()?.products; track
  product.id) {

  <product-card [product]="product"></product-card>
  }
</div>
