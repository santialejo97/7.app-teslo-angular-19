<h1 class="text-3xl font-bold font-montserrat mt-2">Todos los productos</h1>
<h2 class="text-xl mb-7">Para todos los gustos</h2>

@if (this.productsResource.value()?.products?.length == 0) {
<p class="text-2xl font-bold text-center text-accent">
  No hay productos para mostrar en este momento
</p>
} @else {
<div
  class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 mt-2 gap-2"
>
  @for (product of this.productsResource.value()?.products; track product.id) {

  <product-card [product]="product"></product-card>
  }
</div>
}
