<div>
  <div class="flex overflow-hidden">
    <aside
      id="sidebar"
      class="fixed z-20 h-full top-0 left-0 flex lg:flex flex-shrink-0 flex-col w-64 transition-width duration-75"
      aria-label="Sidebar"
    >
      <div
        class="relative flex-1 flex flex-col min-h-0 border-r border-gray-200 pt-0"
      >
        <div class="flex-1 flex flex-col pt-5 pb-4 overflow-y-auto">
          <div class="flex justify-center items-center">
            <a
              routerLink="/"
              class="btn btn-ghost text-xl font-montserrat cursor-pointer"
              style="view-transition-name: logo1"
              >Teslo <span class="text-secondary">| Shop</span></a
            >
          </div>

          <div class="flex-1 px-3 space-y-1">
            <div class="flex justify-center items-center flex-col m-3">
              <span class="font-montserrat text-2xl font-bold no-underline p-3"
                >Bienvenido
              </span>
              <span class="text-xl font-montserrat text-secondary">{{
                user()?.fullName
              }}</span>
            </div>

            <hr />
            <ul class="space-y-2 pb-2">
              <li>
                <a
                  routerLink="/admin/dashboard"
                  routerLinkActive="bg-secondary"
                  class="text-base font-normal rounded-lg flex items-center p-2 hover:bg-secondary hover:text-gray-900 group"
                >
                  <svg
                    class="w-6 h-6 text-gray-500 group-hover:text-gray-900 transition duration-75"
                    fill="currentColor"
                    viewBox="0 0 20 20"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path d="M2 10a8 8 0 018-8v8h8a8 8 0 11-16 0z"></path>
                    <path
                      d="M12 2.252A8.014 8.014 0 0117.748 8H12V2.252z"
                    ></path>
                  </svg>
                  <span class="ml-3">Dashboard</span>
                </a>
              </li>
              <li>
                <a
                  routerLink="/admin/users"
                  class="text-base font-normal rounded-lg hover:bg-secondary hover:text-gray-900 flex items-center p-2 group"
                >
                  <svg
                    class="w-6 h-6 text-gray-500 flex-shrink-0 group-hover:text-gray-900 transition duration-75"
                    fill="currentColor"
                    viewBox="0 0 20 20"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path
                      fill-rule="evenodd"
                      d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"
                      clip-rule="evenodd"
                    ></path>
                  </svg>
                  <span class="ml-3 flex-1 whitespace-nowrap">Users</span>
                </a>
              </li>
              <li>
                <a
                  routerLink="/admin/products"
                  routerLinkActive="bg-secondary text-gray-900"
                  class="text-base font-normal rounded-lg hover:bg-secondary hover:text-gray-900 flex items-center p-2 group"
                >
                  <svg
                    class="w-6 h-6 text-gray-500 flex-shrink-0 group-hover:text-gray-900 transition duration-75"
                    fill="currentColor"
                    viewBox="0 0 20 20"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path
                      fill-rule="evenodd"
                      d="M10 2a4 4 0 00-4 4v1H5a1 1 0 00-.994.89l-1 9A1 1 0 004 18h12a1 1 0 00.994-1.11l-1-9A1 1 0 0015 7h-1V6a4 4 0 00-4-4zm2 5V6a2 2 0 10-4 0v1h4zm-6 3a1 1 0 112 0 1 1 0 01-2 0zm7-1a1 1 0 100 2 1 1 0 000-2z"
                      clip-rule="evenodd"
                    ></path>
                  </svg>
                  <span class="ml-3 flex-1 whitespace-nowrap"
                    >Listado Productos</span
                  >
                </a>
              </li>
              <li>
                <a
                  (click)="this.signOut()"
                  class="text-base font-normal rounded-lg hover:bg-secondary hover:text-gray-900 flex items-center p-2 group"
                >
                  <svg
                    class="w-6 h-6 text-gray-500 flex-shrink-0 group-hover:text-gray-900 transition duration-75"
                    fill="currentColor"
                    viewBox="0 0 20 20"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path
                      fill-rule="evenodd"
                      d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z"
                      clip-rule="evenodd"
                    ></path>
                  </svg>
                  <span class="ml-3 flex-1 whitespace-nowrap">Sign Out</span>
                </a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </aside>
    <div class="flex-1 ml-64 pt-10 px-5">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
